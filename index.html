<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F&G 지수 대시보드</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);

    --diverge-blue:   #2a78d6;  /* 탐욕(위) 쪽 */
    --diverge-red:    #e34948;  /* 공포(아래) 쪽 */
    --diverge-neutral:#f0efec;
    --diverge-blue-wash: rgba(42,120,214,0.10);
    --diverge-red-wash:  rgba(227,73,72,0.10);

    --cat-1: #2a78d6;  /* 실제값 */
    --cat-2: #1baf7a;  /* 우리 계산값 */
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);

      --diverge-blue:   #3987e5;
      --diverge-red:    #e66767;
      --diverge-neutral:#383835;
      --diverge-blue-wash: rgba(57,135,229,0.14);
      --diverge-red-wash:  rgba(230,103,103,0.14);

      --cat-1: #3987e5;
      --cat-2: #199e70;
    }
  }
  :root[data-theme="dark"] .viz-root {
    color-scheme: dark;
    --surface-1:      #1a1a19;
    --page-plane:     #0d0d0d;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --gridline:       #2c2c2a;
    --baseline:       #383835;
    --border:         rgba(255,255,255,0.10);

    --diverge-blue:   #3987e5;
    --diverge-red:    #e66767;
    --diverge-neutral:#383835;
    --diverge-blue-wash: rgba(57,135,229,0.14);
    --diverge-red-wash:  rgba(230,103,103,0.14);

    --cat-1: #3987e5;
    --cat-2: #199e70;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 24px;
  }

  /* ---------- Hero ---------- */
  .hero-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .hero-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .hero-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }

  .hero-updated {
    font-size: 12px;
    color: var(--text-muted);
  }

  .hero-row {
    display: flex;
    align-items: baseline;
    gap: 14px;
    flex-wrap: wrap;
  }

  .hero-figure {
    font-size: 56px;
    font-weight: 600;
    line-height: 1;
  }

  .rating-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
  }

  .rating-badge.fear-side {
    background: var(--diverge-red-wash);
    color: var(--diverge-red);
  }
  .rating-badge.greed-side {
    background: var(--diverge-blue-wash);
    color: var(--diverge-blue);
  }
  .rating-badge.neutral-side {
    background: var(--diverge-neutral);
    color: var(--text-secondary);
  }

  .gauge-wrap {
    display: flex;
    justify-content: center;
    line-height: 0;
  }

  .gauge-caption {
    text-align: center;
    font-weight: 700;
    font-size: 15px;
    margin: 4px 0 0;
  }
  .gauge-caption.fear-side { color: var(--diverge-red); }
  .gauge-caption.greed-side { color: var(--diverge-blue); }
  .gauge-caption.neutral-side { color: var(--text-secondary); }

  .signal-line {
    margin-top: 14px;
    font-size: 15px;
    color: var(--text-primary);
  }
  .signal-line strong {
    color: var(--text-primary);
  }

  /* ---------- Filters ---------- */
  .filter-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .filter-btn {
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-1);
    color: var(--text-secondary);
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--text-primary);
    color: var(--surface-1);
    border-color: var(--text-primary);
  }

  /* ---------- Chart card ---------- */
  .chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    position: relative;
  }

  .chart-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 4px;
  }

  .chart-legend {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 12px;
    display: flex;
    gap: 16px;
  }

  .chart-legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-swatch {
    width: 14px;
    height: 2px;
    border-radius: 1px;
    display: inline-block;
  }

  .diff-stat {
    font-size: 14px;
    color: var(--text-primary);
    margin: 0 0 14px;
  }
  .diff-stat strong {
    font-weight: 700;
  }

  svg.fg-chart {
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--text-primary);
    color: var(--surface-1);
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 8px;
    line-height: 1.5;
    opacity: 0;
    transition: opacity 0.08s ease;
    white-space: nowrap;
    z-index: 10;
  }

  .tooltip .tt-value {
    font-weight: 700;
    font-size: 13px;
  }

  .table-toggle {
    margin-top: 12px;
    font-size: 13px;
    color: var(--text-secondary);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .table-wrap {
    margin-top: 12px;
    max-height: 260px;
    overflow-y: auto;
    border-top: 1px solid var(--gridline);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  th, td {
    text-align: left;
    padding: 6px 4px;
    border-bottom: 1px solid var(--gridline);
    font-variant-numeric: tabular-nums;
  }

  th {
    color: var(--text-muted);
    font-weight: 500;
    position: sticky;
    top: 0;
    background: var(--surface-1);
  }

  /* ---------- Live score card ---------- */
  .live-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 20px;
  }

  .live-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .live-label {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary);
    margin: 0;
  }

  .live-pulse {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--diverge-blue);
    display: inline-block;
  }

  .live-figure {
    font-size: 36px;
    font-weight: 600;
    margin-top: 8px;
  }

</style>
</head>
<body>
<div class="viz-root">
<main>
  <h2 class="sr-only">FABOT 공포·탐욕 지수 대시보드. 오늘의 점수, 매매 신호, 2009년부터 오늘까지의 F&G 지수 추이 차트를 보여줍니다.</h2>

  <h1>F&G 지수 대시보드</h1>

  <p style="margin:-16px 0 20px;"><a href="https://fabot-trade-journal.onrender.com/" target="_blank" rel="noopener">📓 매매일지로 가기 →</a></p>

  <section class="hero-card">
    <div class="hero-header">
      <p class="hero-label">오늘의 F&G 지수</p>
      <span class="hero-updated" id="updated-note"></span>
    </div>
    <div class="gauge-wrap" id="gauge-wrap"></div>
    <p class="gauge-caption" id="gauge-caption">–</p>
    <p class="signal-line" hidden>판정 신호: <strong id="signal-text">–</strong></p>
  </section>

  <div class="filter-row" id="filter-row">
    <button class="filter-btn" data-range="30">최근 30일</button>
    <button class="filter-btn active" data-range="90">최근 90일</button>
    <button class="filter-btn" data-range="365">최근 1년</button>
    <button class="filter-btn" data-range="all">전체</button>
  </div>

  <section class="chart-card">
    <p class="chart-title">F&G 지수 추이</p>
    <div style="position:relative;">
      <svg class="fg-chart" id="chart" viewBox="0 0 640 260" role="img" aria-label="F&G 지수 추이 차트"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
    <button class="table-toggle" id="table-toggle">표로 보기</button>
    <div class="table-wrap" id="table-wrap" hidden>
      <table>
        <thead><tr><th>날짜</th><th>F&G 점수</th></tr></thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </section>

  <section class="live-card">
    <div class="live-header">
      <p class="live-label">실시간 계산</p>
      <span class="live-pulse"><span class="live-dot"></span><span id="live-updated">불러오는 중...</span></span>
    </div>
    <p class="live-figure" id="live-score">–</p>
  </section>

  <div class="filter-row" id="live-history-filter-row">
    <button class="filter-btn" data-hours="1">1시간</button>
    <button class="filter-btn" data-hours="6">6시간</button>
    <button class="filter-btn active" data-hours="24">24시간</button>
    <button class="filter-btn" data-hours="168">7일</button>
  </div>

  <section class="chart-card">
    <p class="chart-title">실시간 계산값 추이</p>
    <div style="position:relative;">
      <svg class="fg-chart" id="live-history-chart" viewBox="0 0 640 260" role="img" aria-label="실시간 계산값 추이 차트"></svg>
      <div class="tooltip" id="live-history-tooltip"></div>
    </div>
  </section>

  <div class="filter-row" id="compare-filter-row">
    <button class="filter-btn" data-range="30">최근 30일</button>
    <button class="filter-btn active" data-range="90">최근 90일</button>
    <button class="filter-btn" data-range="365">최근 1년</button>
    <button class="filter-btn" data-range="all">전체 (2011~)</button>
  </div>

  <section class="chart-card">
    <p class="chart-title">F&G vs 일별 계산값</p>
    <p class="chart-legend">
      <span><span class="legend-swatch" style="background:var(--cat-1)"></span>F&G</span>
      <span><span class="legend-swatch" style="background:var(--cat-2)"></span>일별 계산값</span>
    </p>
    <p class="diff-stat" id="diff-stat"></p>
    <div style="position:relative;">
      <svg class="fg-chart" id="compare-chart" viewBox="0 0 640 260" role="img" aria-label="실제값과 계산값 비교 차트"></svg>
      <div class="tooltip" id="compare-tooltip"></div>
    </div>
  </section>
</main>
</div>

<script src="fg_data.js"></script>
<script>
(function () {
  const history = FG_DATA.history; // [{date, score, source}], 오래된 순
  const today = FG_DATA.today;
  const comparison = FG_DATA.comparison; // [{date, real, calculated}], 2011~오늘

  // 데이터가 거래일 기준(주말·공휴일 제외)이라, "최근 N일" 필터를 마지막 N개 행으로 자르면
  // 실제로는 N 캘린더일보다 훨씬 더 과거까지 거슬러 올라가게 된다(예: 90거래일 ≈ 133캘린더일).
  // 그래서 행 개수가 아니라 실제 달력 날짜로 잘라야 한다.
  function daysAgo(dateStr, days) {
    const d = new Date(dateStr + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - days);
    return d.toISOString().slice(0, 10);
  }

  // publishable key는 브라우저에 공개돼도 되는 키입니다 (RLS로 보호됨).
  const SUPABASE_URL = "https://wckohdcjpjlzeaiehmzs.supabase.co";
  const SUPABASE_KEY = "sb_publishable_4fPOT_f1VwEvH4gEXumgjg_JH-7X_mY";

  let currentRange = "90"; // "F&G 지수 추이" 차트의 현재 선택 구간
  let currentCompareRange = "90"; // "F&G vs 일별 계산값" 차트의 현재 선택 구간 (실시간 동기화 재렌더링에 씀

  function toKstDateStr(date) {
    // comparison 배열의 date는 시각 없는 "그 날짜"(한국 거래일) 기준이라, UTC 타임스탬프를
    // 그대로 slice하면 자정 근처에 하루가 밀릴 수 있어 KST로 보정해서 날짜만 뽑는다.
    const kst = new Date(date.getTime() + 9 * 3600 * 1000);
    return kst.toISOString().slice(0, 10);
  }

  // "F&G vs 일별 계산값" 차트는 배치(build_index.py)로 하루 한 번 정도만 갱신되는 정적
  // 데이터라, 최근 실시간 계산값과 어긋나 보일 수 있었다(2026-07-25 사용자 피드백).
  // 실시간 값을 받아올 때마다 comparison의 "오늘" 항목을 그 값으로 덮어써서(또는 없으면
  // 새로 추가해서) 두 차트가 같은 날짜에 대해 항상 같은 숫자를 보여주게 한다. "실제(CNN)"
  // 값은 주말/휴장일엔 아예 없을 수 있어서, 없으면 직전 값을 그대로 이어서 보여준다.
  function syncComparisonWithLive(liveScore, liveDate) {
    const dateStr = toKstDateStr(liveDate);
    const existing = comparison.find((row) => row.date === dateStr);
    if (existing) {
      existing.calculated = liveScore;
    } else {
      const prevReal = comparison.length ? comparison[comparison.length - 1].real : null;
      comparison.push({ date: dateStr, real: prevReal, calculated: liveScore });
    }
    renderCompareAll(currentCompareRange);
  }

  // "F&G 지수 추이" 차트는 실제 CNN 지수만 보여준다(2026-07-26 확정 — "F&G 지수차트는
  // CNN F&G지수 값만 쓰는거야"). 그래서 comparison과 달리 이 차트는 실시간 가격기반
  // 추정치를 주입하지 않는다 — export_dashboard_data.py에서 애초에 real_score가 없는
  // 2011년 이후 날짜(주말 등)는 history에서 제외하도록 처리함.

  async function fetchLiveScore() {
    const scoreEl = document.getElementById("live-score");
    const updatedEl = document.getElementById("live-updated");
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/live_scores?source=eq.price_based&order=computed_at.desc&limit=1`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }, cache: "no-store" }
      );
      if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
      const rows = await res.json();
      if (rows.length === 0) {
        scoreEl.textContent = "아직 기록 없음";
        updatedEl.textContent = "";
        return;
      }
      const liveScore = Number(rows[0].score);
      scoreEl.textContent = liveScore.toFixed(1);
      const computedAt = new Date(rows[0].computed_at);
      const dateLabel = computedAt.toLocaleDateString("ko-KR");
      const timeLabel = computedAt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      updatedEl.textContent = `${dateLabel} ${timeLabel}`;
      syncComparisonWithLive(liveScore, computedAt);
    } catch (err) {
      scoreEl.textContent = "불러오기 실패";
      updatedEl.textContent = "";
    }
  }

  // ---------- 실시간 계산값 추이 차트 (Supabase live_scores 히스토리) ----------

  function renderLiveHistoryChart(data) {
    const svg = document.getElementById("live-history-chart");
    svg.innerHTML = "";
    const n = data.length;
    if (n === 0) return;
    const ns = SVG_NS;
    const baselineY = yScale(50);

    drawGridlines(svg, true);

    // F&G 지수 추이 차트와 동일한 스타일: 50 기준 위(탐욕)/아래(공포) 영역 채우기.
    function buildAreaPath(clampFn) {
      let d = `M ${xScale(0, n)} ${baselineY} `;
      for (let i = 0; i < n; i++) {
        d += `L ${xScale(i, n)} ${yScale(clampFn(data[i].score))} `;
      }
      d += `L ${xScale(n - 1, n)} ${baselineY} Z`;
      return d;
    }

    const abovePath = document.createElementNS(ns, "path");
    abovePath.setAttribute("d", buildAreaPath((v) => Math.max(v, 50)));
    abovePath.setAttribute("fill", "var(--diverge-blue-wash)");
    svg.appendChild(abovePath);

    const belowPath = document.createElementNS(ns, "path");
    belowPath.setAttribute("d", buildAreaPath((v) => Math.min(v, 50)));
    belowPath.setAttribute("fill", "var(--diverge-red-wash)");
    svg.appendChild(belowPath);

    let lineD = "";
    data.forEach((d, i) => {
      lineD += (i === 0 ? "M " : "L ") + xScale(i, n) + " " + yScale(d.score) + " ";
    });
    const linePath = document.createElementNS(ns, "path");
    linePath.setAttribute("d", lineD);
    linePath.setAttribute("fill", "none");
    linePath.setAttribute("stroke", "var(--text-secondary)");
    linePath.setAttribute("stroke-width", "2");
    linePath.setAttribute("stroke-linejoin", "round");
    linePath.setAttribute("stroke-linecap", "round");
    svg.appendChild(linePath);

    const lastX = xScale(n - 1, n), lastY = yScale(data[n - 1].score);
    // 최고/최저가 현재값과 같은 자리면 그 표시는 생략한다(skipIdx = 마지막 인덱스).
    addMinMaxMarkers(svg, data, (d) => d.score, null, null, n - 1);

    const endDot = document.createElementNS(ns, "circle");
    endDot.setAttribute("cx", lastX);
    endDot.setAttribute("cy", lastY);
    endDot.setAttribute("r", "4");
    endDot.setAttribute("fill", data[n - 1].score >= 50 ? "var(--diverge-blue)" : "var(--diverge-red)");
    endDot.setAttribute("stroke", "var(--surface-1)");
    endDot.setAttribute("stroke-width", "2");
    svg.appendChild(endDot);

    const endLabel = document.createElementNS(ns, "text");
    endLabel.setAttribute("x", lastX - 6);
    endLabel.setAttribute("y", lastY - 10);
    endLabel.setAttribute("text-anchor", "end");
    endLabel.setAttribute("font-size", "12");
    endLabel.setAttribute("font-weight", "700");
    endLabel.setAttribute("fill", "var(--text-primary)");
    endLabel.textContent = data[n - 1].score.toFixed(1);
    svg.appendChild(endLabel);

    const crosshair = createCrosshair(svg);
    const hoverDot = document.createElementNS(ns, "circle");
    hoverDot.setAttribute("r", "5");
    hoverDot.setAttribute("fill", data[n - 1].score >= 50 ? "var(--diverge-blue)" : "var(--diverge-red)");
    hoverDot.setAttribute("stroke", "var(--surface-1)");
    hoverDot.setAttribute("stroke-width", "2");
    hoverDot.setAttribute("visibility", "hidden");
    svg.appendChild(hoverDot);

    const hitArea = createHitArea(svg);
    const tooltip = document.getElementById("live-history-tooltip");

    function showTooltipAt(clientEvtX) {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientEvtX - rect.left) / rect.width) * CHART_W;
      let idx = Math.round(((relX - PAD.left) / plotW) * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));

      const px = xScale(idx, n), py = yScale(data[idx].score);
      crosshair.setAttribute("x1", px);
      crosshair.setAttribute("x2", px);
      crosshair.setAttribute("visibility", "visible");
      hoverDot.setAttribute("cx", px);
      hoverDot.setAttribute("cy", py);
      hoverDot.setAttribute("fill", data[idx].score >= 50 ? "var(--diverge-blue)" : "var(--diverge-red)");
      hoverDot.setAttribute("visibility", "visible");

      tooltip.style.opacity = "1";
      tooltip.innerHTML = "";
      const timeLine = document.createElement("div");
      timeLine.textContent = data[idx].time.toLocaleString("ko-KR", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit",
      });
      const valueLine = document.createElement("div");
      valueLine.className = "tt-value";
      valueLine.textContent = data[idx].score.toFixed(1) + "점";
      tooltip.appendChild(timeLine);
      tooltip.appendChild(valueLine);

      const svgPixelRect = svg.getBoundingClientRect();
      const scaleX = svgPixelRect.width / CHART_W;
      const tooltipX = px * scaleX;
      tooltip.style.left = Math.min(tooltipX + 10, svgPixelRect.width - 110) + "px";
      tooltip.style.top = (py * (svgPixelRect.height / CHART_H) - 40) + "px";
    }

    function hideTooltip() {
      crosshair.setAttribute("visibility", "hidden");
      hoverDot.setAttribute("visibility", "hidden");
      tooltip.style.opacity = "0";
    }

    hitArea.addEventListener("pointermove", (e) => showTooltipAt(e.clientX));
    hitArea.addEventListener("pointerleave", hideTooltip);
  }

  let liveHistoryRangeHours = 24; // 필터 버튼으로 바뀌는 현재 선택 구간, 60초 자동갱신도 이 값을 씀

  // PostgREST(Supabase)는 요청한 limit과 무관하게 서버 기본 max-rows(1000)로 한 번의
  // 응답을 자른다(2026-07-26 실측: 7일치 3224건 중 0-999만 반환됨). DB에는 데이터가
  // 전부 그대로 쌓여있으니(지워지는 게 아니라 한 번에 못 받아오는 것뿐), offset을
  // 옮겨가며 여러 번 나눠 받아서 요청한 기간 전체를 다 채운다. desc로 최신 페이지부터
  // 받는 이유: 도중에 실패하거나 페이지 수를 못 채워도 최소한 "최근" 데이터는 항상
  // 확보되게 하기 위함(과거 데이터가 빠지는 게 최신 데이터가 빠지는 것보다 낫다).
  const SUPABASE_PAGE_SIZE = 1000;

  async function fetchAllLiveScores(sinceIso, source = "price_based") {
    const rows = [];
    let offset = 0;
    while (true) {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/live_scores?source=eq.${source}&computed_at=gte.${sinceIso}&order=computed_at.desc&limit=${SUPABASE_PAGE_SIZE}&offset=${offset}`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }, cache: "no-store" }
      );
      if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
      const page = await res.json();
      rows.push(...page);
      if (page.length < SUPABASE_PAGE_SIZE) break; // 마지막 페이지(그 기간의 가장 오래된 데이터까지 다 받음)
      offset += SUPABASE_PAGE_SIZE;
    }
    return rows;
  }

  async function fetchLiveHistory(hours = liveHistoryRangeHours) {
    liveHistoryRangeHours = hours;
    try {
      const sinceIso = new Date(Date.now() - hours * 3600 * 1000).toISOString();
      const rows = await fetchAllLiveScores(sinceIso);
      const data = rows.reverse().map((r) => ({ time: new Date(r.computed_at), score: Number(r.score) }));
      renderLiveHistoryChart(data);
    } catch (err) {
      document.getElementById("live-history-chart").innerHTML = "";
    }
  }

  // dateField: cnn_real은 실제로 "그 값이 언제 날짜 것인지"가 as_of에 있고 computed_at은
  // 그냥 "언제 확인했나"라 주말에도 매번 새로 찍힌다(CNN이 새 값을 안 줘도). computed_at
  // 기준으로 묶으면 주말/휴장일에 같은 오래된 값이 여러 날짜에 중복 배정된다 — 그래서
  // cnn_real은 as_of로, daily_snapshot(그 자체가 "오늘" 기준으로 한 번만 찍음)은
  // computed_at으로 묶는다.
  function groupLatestByKstDate(rows, dateField) {
    const byDate = new Map();
    for (const r of rows) {
      const dateStr = toKstDateStr(new Date(r[dateField]));
      const existing = byDate.get(dateStr);
      if (!existing || new Date(r.computed_at) > new Date(existing.computed_at)) {
        byDate.set(dateStr, r);
      }
    }
    return byDate;
  }

  // 정적 배치 내보내기(FG_DATA, build_index.py 수동 실행 시점까지만 있음)가 못 다루는
  // "그 이후" 날짜를, 이제 매일 자동으로 쌓이는 Supabase의 daily_snapshot(계산값)/
  // cnn_real(실제값)로 채운다 — build_index.py를 다시 안 돌려도 두 차트가 매일 자동으로
  // 이어진다(2026-07-27, "일별 계산치는 꼭 저장해야된다" 후속 작업).
  // cnn_real은 5분마다 값이 안 바뀌어도 새 행을 쌓아서(2026-09-14 기준 7만 6천행+)
  // fetchAllLiveScores로 몇 달치를 받으면 77번 넘게 순차 페이지네이션을 해야 했다 —
  // 그러다 중간에 실패하면 syncDailyDataFromSupabase의 catch가 조용히 삼켜서, 비교
  // 차트가 몇 달째 갱신 안 되는 걸 아무도 몰랐다(2026-09-14 사용자 지적: "최신화가
  // 안되어있어요"). Supabase에 하루당 최신값 하나만 주는 cnn_real_daily/
  // daily_snapshot_daily 함수를 만들어두고 그걸 한 번씩만 부른다 — 함수가 없는
  // 환경에서는 예전 방식(fetchAllLiveScores)으로 자동 대체한다.
  async function fetchDailyRpc(fnName, days) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ target_days: days }),
      cache: "no-store",
    });
    if (!res.ok) throw new Error("RPC 없음 또는 오류 (" + res.status + ")");
    const rows = await res.json();
    return new Map(rows.map((r) => [r.day, { score: r.score }]));
  }

  async function syncDailyDataFromSupabase() {
    try {
      const lastDate = comparison.length ? comparison[comparison.length - 1].date : "2000-01-01";

      // 2026-08-12 수정(1차: `d > lastDate` → `d >= lastDate`만으로는 부족했다). CNN
      // 실제값의 as_of 날짜(KST 변환 기준)는 미국 거래일 기준이라, 한국시간 자정을
      // 넘긴 직후엔 "오늘"(lastDate)보다 하루 전 날짜로 잡힌다 — 그 하루 전 날짜가
      // 이미 잘못된(하루 이른 시각의 낮은) 값으로 한 번 굳어 있었다면, `>= lastDate`
      // 필터가 그 과거 날짜를 걸러내서(이미 lastDate보다 작아짐) 영원히 재보정이
      // 안 된다 — 실측: 8/11이 39.4로 굳어 있었고, 8/12가 그 값을 그대로 물려받음.
      // 그래서 "오늘"만 보지 않고 최근 며칠을 매번 다시 스캔해서, 언제 새로고침하든
      // 최근 며칠치가 스스로 재보정되게 한다.
      const REFRESH_LOOKBACK_DAYS = 4;
      const lookbackDate = toKstDateStr(new Date(Date.now() - REFRESH_LOOKBACK_DAYS * 86400000));
      const cursorDate = lastDate < lookbackDate ? lastDate : lookbackDate;
      const sinceIso = new Date(cursorDate + "T00:00:00+09:00").toISOString();

      // cursorDate가 몇 달 전(예: 정적 파일이 오래돼서)이어도 다 따라잡을 수 있게,
      // 필요한 일수만큼 넉넉히(+10일 여유) 요청한다.
      const gapDays = Math.max(
        REFRESH_LOOKBACK_DAYS + 1,
        Math.ceil((Date.now() - new Date(cursorDate + "T00:00:00+09:00").getTime()) / 86400000) + 10
      );

      let dailyByDate, cnnByDate;
      try {
        [dailyByDate, cnnByDate] = await Promise.all([
          fetchDailyRpc("daily_snapshot_daily", gapDays),
          fetchDailyRpc("cnn_real_daily", gapDays),
        ]);
      } catch {
        // RPC 함수가 아직 안 만들어진 환경 — 예전 방식으로 대체
        const [dailyRows, cnnRows] = await Promise.all([
          fetchAllLiveScores(sinceIso, "daily_snapshot"),
          fetchAllLiveScores(sinceIso, "cnn_real"),
        ]);
        dailyByDate = groupLatestByKstDate(dailyRows, "computed_at");
        cnnByDate = groupLatestByKstDate(cnnRows, "as_of");
      }

      // 2026-08-12 수정(2차): "오늘"처럼 그 날짜 자체엔 cnn_real이 없는 항목은 예전엔
      // "항목이 생성되는 그 순간"에만 직전 값을 한 번 물려받고 끝이었다 — 그래서 어제
      // 값이 나중에 바로잡혀도(예: 8/11 39.4→60.8) 이미 만들어진 오늘 항목은 계속
      // 낡은 값에 갇혀 있었다(실측: 8/11이 고쳐진 뒤에도 8/12가 여전히 39.4). 날짜
      // 오름차순으로 처리하면서 매번 "직전 확정값"을 다시 이어받게 바꿨다 — 그래야
      // 앞 날짜가 이번 실행에서 보정되면 뒷 날짜(오늘)도 곧바로 그 값을 따라간다.
      // 2026-08-12 수정(3차): "오늘"은 cnn_real도 daily_snapshot도 그 날짜 자체로는
      // 아예 없는 게 정상이다(CNN이 아직 오늘자 값을 안 냄) — 그래서 newDates가 이
      // 두 맵의 키에서만 만들어지면 "오늘"은 애초에 이 목록에 들어가지도 않아 위
      // 재보정 로직을 한 번도 못 탔다(실측: 8/11만 고쳐지고 8/12는 여전히 39.4).
      // comparison에 이미 있는 최근 날짜도 강제로 포함시켜, 자기 날짜엔 새 데이터가
      // 없어도 매번 직전 확정값을 다시 이어받도록 한다.
      const existingDatesInWindow = comparison.filter((row) => row.date >= cursorDate).map((row) => row.date);
      const newDates = [...new Set([...existingDatesInWindow, ...dailyByDate.keys(), ...cnnByDate.keys()])]
        .filter((d) => d >= cursorDate)
        .sort();

      const cursorIdx = comparison.findIndex((row) => row.date >= cursorDate);
      const beforeCursor = cursorIdx > 0 ? comparison[cursorIdx - 1] : null;
      let runningReal = beforeCursor ? beforeCursor.real : null;
      let runningCalc = beforeCursor ? beforeCursor.calculated : null;

      const todayStr = toKstDateStr(new Date());
      for (const dateStr of newDates) {
        const dailyRow = dailyByDate.get(dateStr);
        const cnnRow = cnnByDate.get(dateStr);

        let entry = comparison.find((row) => row.date === dateStr);
        const isNewEntry = !entry;
        if (!entry) {
          entry = { date: dateStr, real: runningReal, calculated: runningCalc };
          comparison.push(entry);
        }
        entry.real = cnnRow ? Number(cnnRow.score) : runningReal;
        // "오늘"은 daily_snapshot이 보통 23:55 이후에나 생긴다 — 그 전까지 여기서
        // 어제 값을 그대로 이어붙이면, fetchLiveScore/syncComparisonWithLive가
        // 방금 채워둔 실시간 계산값을 덮어써 버린다(2026-09-14 사용자 지적 —
        // "실시간 계산"은 47.8인데 비교 차트는 51.6으로 나옴). daily_snapshot이
        // 실제로 생겼을 때(그게 더 확정된 값)만 오늘 값을 갱신하고, 아직 없으면
        // 기존 항목은 건드리지 않는다(새로 만드는 항목만 임시로 어제 값을 이어붙임).
        if (dailyRow) {
          entry.calculated = Number(dailyRow.score);
        } else if (dateStr !== todayStr || isNewEntry) {
          entry.calculated = runningCalc;
        }
        runningReal = entry.real;
        runningCalc = entry.calculated;

        // history: CNN 실제값만(2026-07-26 확정 — "F&G 지수차트는 CNN F&G지수 값만 쓰는거야").
        // 그 날짜 자체에 실제 cnn_real이 없으면 추가/갱신하지 않는다(직전 값 이어붙이기는
        // comparison에서만 하고, history는 실제 발표된 날짜만 정직하게 남긴다).
        if (cnnRow) {
          let historyEntry = history.find((row) => row.date === dateStr);
          if (!historyEntry) {
            historyEntry = { date: dateStr, score: Number(cnnRow.score), source: "cnn_real" };
            history.push(historyEntry);
          } else {
            historyEntry.score = Number(cnnRow.score);
          }
        }
      }

      comparison.sort((a, b) => a.date.localeCompare(b.date));
      history.sort((a, b) => a.date.localeCompare(b.date));

      renderAll(currentRange);
      renderCompareAll(currentCompareRange);
    } catch (err) {
      // 실패해도 정적 데이터로 화면은 이미 정상 표시되니 조용히 넘어간다.
    }
  }

  const RATING_LABELS = {
    "extreme fear": "극단적 공포", "fear": "공포", "neutral": "중립",
    "greed": "탐욕", "extreme greed": "극단적 탐욕",
  };

  // 반원 게이지 SVG — fabot-trade-journal(public/app.js)의 buildGaugeSvg를 그대로 옮겨왔다.
  const GAUGE_CX = 180;
  const GAUGE_CY = 190;
  const GAUGE_R_OUTER = 166;
  const GAUGE_R_INNER = 55;
  const ZONE_GAP = 0.8;

  const GAUGE_ZONES = [
    { min: 0, max: 24.5, lines: ["극단적", "공포"], fill: "#eb9a86", stroke: "#d97552", text: "#7a3a22" },
    { min: 24.5, max: 44.5, lines: ["공포"], fill: "#f2c9a8", stroke: "#dba872", text: "#8a5a2a" },
    { min: 44.5, max: 55.5, lines: ["중립"], fill: "#ece6d6", stroke: "#c7bd9e", text: "#5c5640" },
    { min: 55.5, max: 75.5, lines: ["탐욕"], fill: "#cbe3b8", stroke: "#a0c987", text: "#3f5c2c" },
    { min: 75.5, max: 100, lines: ["극단적", "탐욕"], fill: "#8fca86", stroke: "#5fa855", text: "#254a1e" },
  ];

  function gaugePolarPoint(radius, value) {
    const angleDeg = 180 - (value / 100) * 180;
    const angleRad = (angleDeg * Math.PI) / 180;
    return {
      x: GAUGE_CX + radius * Math.cos(angleRad),
      y: GAUGE_CY - radius * Math.sin(angleRad),
    };
  }

  function gaugeSectorPath(minValue, maxValue) {
    const a = minValue + ZONE_GAP;
    const b = maxValue - ZONE_GAP;
    const outerStart = gaugePolarPoint(GAUGE_R_OUTER, a);
    const outerEnd = gaugePolarPoint(GAUGE_R_OUTER, b);
    const innerEnd = gaugePolarPoint(GAUGE_R_INNER, b);
    const innerStart = gaugePolarPoint(GAUGE_R_INNER, a);
    return (
      `M ${outerStart.x.toFixed(1)} ${outerStart.y.toFixed(1)} ` +
      `A ${GAUGE_R_OUTER} ${GAUGE_R_OUTER} 0 0 1 ${outerEnd.x.toFixed(1)} ${outerEnd.y.toFixed(1)} ` +
      `L ${innerEnd.x.toFixed(1)} ${innerEnd.y.toFixed(1)} ` +
      `A ${GAUGE_R_INNER} ${GAUGE_R_INNER} 0 0 0 ${innerStart.x.toFixed(1)} ${innerStart.y.toFixed(1)} Z`
    );
  }

  function gaugeFindZoneIndex(score) {
    const clamped = Math.max(0, Math.min(100, score));
    const idx = GAUGE_ZONES.findIndex((z) => clamped >= z.min && clamped < z.max);
    return idx === -1 ? GAUGE_ZONES.length - 1 : idx;
  }

  function buildGaugeSvg(score) {
    const activeIdx = gaugeFindZoneIndex(score);

    const sectors = GAUGE_ZONES.map((zone, i) => {
      const active = i === activeIdx;
      const fill = active ? zone.fill : "#ffffff";
      const stroke = active ? zone.stroke : "#e1e0d9";
      return `<path d="${gaugeSectorPath(zone.min, zone.max)}" fill="${fill}" stroke="${stroke}" stroke-width="1.5" />`;
    }).join("");

    const ZONE_LABEL_R = (GAUGE_R_OUTER + GAUGE_R_INNER) / 2;
    const LINE_STEP = 11;

    function labelArcPathId(radius) {
      return `zoneLabelArc${Math.round(radius * 10)}`;
    }
    function labelArcDefFor(radius) {
      const start = gaugePolarPoint(radius, 0);
      const end = gaugePolarPoint(radius, 100);
      return `<path id="${labelArcPathId(radius)}" fill="none"
        d="M ${start.x.toFixed(1)} ${start.y.toFixed(1)}
           A ${radius} ${radius} 0 0 1 ${end.x.toFixed(1)} ${end.y.toFixed(1)}" />`;
    }

    const usedRadii = new Set();
    GAUGE_ZONES.forEach((zone) => {
      if (zone.lines.length === 1) {
        usedRadii.add(ZONE_LABEL_R);
      } else {
        usedRadii.add(ZONE_LABEL_R + LINE_STEP);
        usedRadii.add(ZONE_LABEL_R - LINE_STEP);
      }
    });
    const labelArcDef = [...usedRadii].map(labelArcDefFor).join("");

    const zoneLabels = GAUGE_ZONES.map((zone, i) => {
      const active = i === activeIdx;
      const mid = (zone.min + zone.max) / 2;
      const fill = active ? zone.text : "#4a4844";
      const radii = zone.lines.length === 1 ? [ZONE_LABEL_R] : [ZONE_LABEL_R + LINE_STEP, ZONE_LABEL_R - LINE_STEP];
      return zone.lines
        .map((line, li) => `<text font-size="13" font-weight="800" fill="${fill}">
          <textPath href="#${labelArcPathId(radii[li])}" startOffset="${mid}%" text-anchor="middle" letter-spacing="0.5">${line}</textPath>
        </text>`)
        .join("");
    }).join("");

    const tickMarks = [0, 25, 50, 75, 100]
      .map((v) => {
        const dot = gaugePolarPoint(GAUGE_R_OUTER, v);
        const isEdge = v === 0 || v === 100;
        const label = gaugePolarPoint(GAUGE_R_OUTER + (isEdge ? 30 : 24), v);
        const anchor = v <= 10 ? "start" : v >= 90 ? "end" : "middle";
        const dy = isEdge ? 18 : 0;
        return (
          `<circle cx="${dot.x.toFixed(1)}" cy="${dot.y.toFixed(1)}" r="3" fill="#c7c4b8" />` +
          `<text x="${label.x.toFixed(1)}" y="${(label.y + dy).toFixed(1)}" text-anchor="${anchor}" font-size="16" font-weight="800" fill="#0b0b0b">${v}</text>`
        );
      })
      .join("");

    const clampedScore = Math.max(0, Math.min(100, score));
    const needleTip = gaugePolarPoint(GAUGE_R_INNER + (GAUGE_R_OUTER - GAUGE_R_INNER) * 0.6, clampedScore);
    const needleAngle = (180 - (clampedScore / 100) * 180 + 90) * (Math.PI / 180);
    const perpX = Math.cos(needleAngle) * 5;
    const perpY = -Math.sin(needleAngle) * 5;

    return `
      <svg viewBox="-50 -22 461 269" style="width: 100%; height: auto; max-width: 380px; display: block;">
        <defs>${labelArcDef}</defs>
        ${sectors}
        ${zoneLabels}
        ${tickMarks}
        <path d="M ${(GAUGE_CX - perpX).toFixed(1)} ${(GAUGE_CY - perpY).toFixed(1)}
          L ${needleTip.x.toFixed(1)} ${needleTip.y.toFixed(1)}
          L ${(GAUGE_CX + perpX).toFixed(1)} ${(GAUGE_CY + perpY).toFixed(1)} Z"
          fill="#2b2a27" />
        <circle cx="${GAUGE_CX}" cy="${GAUGE_CY}" r="9" fill="#2b2a27" />
        <circle cx="${GAUGE_CX}" cy="${GAUGE_CY}" r="4" fill="#fcfcfb" />
        <text x="${GAUGE_CX}" y="${GAUGE_CY + 46}" text-anchor="middle" font-size="40" font-weight="800" fill="#0b0b0b">${score.toFixed(0)}</text>
      </svg>
    `;
  }

  function ratingSide(score) {
    if (score < 45) return "fear-side";
    if (score > 55) return "greed-side";
    return "neutral-side";
  }

  function judgeSignal(score) {
    if (score <= 15) return "TQQQ 매수 100% (극단적 공포)";
    if (score <= 20) return "TQQQ 매수 50%";
    if (score <= 25) return "TQQQ 매수 25%";
    if (score >= 80) return "TQQQ 매도 전량 (극단적 탐욕)";
    if (score >= 75) return "TQQQ 매도 50%";
    if (score >= 35 && score <= 65) return "커버드콜 추가매수 20% (평시)";
    return "대기 (매수/매도 조건 밖)";
  }

  // 실시간 CNN 값을 받아오기 전까지 보여줄 초기값 (정적 스냅샷)
  let currentHero = { score: today.score, rating: today.rating, signal: today.signal };

  function renderHero(whenLabel) {
    document.getElementById("gauge-wrap").innerHTML = buildGaugeSvg(currentHero.score);
    const caption = document.getElementById("gauge-caption");
    caption.className = "gauge-caption " + ratingSide(currentHero.score);
    caption.textContent = RATING_LABELS[currentHero.rating] || currentHero.rating;
    document.getElementById("signal-text").textContent = currentHero.signal;
    document.getElementById("updated-note").textContent = whenLabel;
  }

  async function fetchCnnRealScore() {
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/live_scores?source=eq.cnn_real&order=computed_at.desc&limit=1`,
        { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }, cache: "no-store" }
      );
      if (!res.ok) throw new Error("서버 응답 오류 (" + res.status + ")");
      const rows = await res.json();
      if (rows.length === 0) return; // 아직 GitHub Actions가 한 번도 안 돌았으면 정적 스냅샷 유지

      const score = Number(rows[0].score);
      currentHero = { score, rating: score < 45 ? "fear" : score > 55 ? "greed" : "neutral", signal: judgeSignal(score) };
      // as_of는 CNN이 그날 값에 붙이는 고정 날짜(UTC 자정=한국시간 오전 9시)라 "지금"을 안 뜻해요.
      // 대신 우리가 실제로 마지막에 확인(GitHub Actions 실행)한 시각을 보여줍니다.
      const checkedAt = new Date(rows[0].computed_at);
      const dateLabel = checkedAt.toLocaleDateString("ko-KR");
      const timeLabel = checkedAt.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
      renderHero(`${dateLabel} ${timeLabel}`);
    } catch (err) {
      // 실패하면 마지막으로 보여주던 값을 그대로 유지 (화면이 깨지지 않게)
    }
  }

  function filterRange(rangeKey) {
    if (rangeKey === "all") return history;
    if (history.length === 0) return history;
    const days = Number(rangeKey);
    const cutoff = daysAgo(history[history.length - 1].date, days);
    return history.filter((row) => row.date >= cutoff);
  }

  function renderTable(data) {
    const tbody = document.getElementById("table-body");
    tbody.innerHTML = "";
    const recentFirst = data.slice().reverse();
    for (const row of recentFirst) {
      const tr = document.createElement("tr");
      const tdDate = document.createElement("td");
      tdDate.textContent = row.date;
      const tdScore = document.createElement("td");
      tdScore.textContent = row.score.toFixed(1);
      tr.appendChild(tdDate);
      tr.appendChild(tdScore);
      tbody.appendChild(tr);
    }
  }

  const CHART_W = 640, CHART_H = 260;
  const PAD = { top: 16, right: 12, bottom: 24, left: 30 };
  const plotW = CHART_W - PAD.left - PAD.right;
  const plotH = CHART_H - PAD.top - PAD.bottom;

  function xScale(i, n) {
    if (n <= 1) return PAD.left;
    return PAD.left + (i / (n - 1)) * plotW;
  }
  function yScale(v) {
    return PAD.top + (1 - v / 100) * plotH;
  }

  const SVG_NS = "http://www.w3.org/2000/svg";

  // 0/50/100 그리드라인 + 눈금 라벨 (renderChart·renderCompareChart 공용)
  function drawGridlines(svg, highlightBaseline) {
    [0, 50, 100].forEach((v) => {
      const line = document.createElementNS(SVG_NS, "line");
      line.setAttribute("x1", PAD.left);
      line.setAttribute("x2", CHART_W - PAD.right);
      line.setAttribute("y1", yScale(v));
      line.setAttribute("y2", yScale(v));
      line.setAttribute("stroke", highlightBaseline && v === 50 ? "var(--baseline)" : "var(--gridline)");
      line.setAttribute("stroke-width", "1");
      svg.appendChild(line);

      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("x", PAD.left - 6);
      label.setAttribute("y", yScale(v) + 4);
      label.setAttribute("text-anchor", "end");
      label.setAttribute("font-size", "10");
      label.setAttribute("fill", "var(--text-muted)");
      label.textContent = v;
      svg.appendChild(label);
    });
  }

  // 세로 크로스헤어 선 (renderChart·renderCompareChart 공용)
  function createCrosshair(svg) {
    const crosshair = document.createElementNS(SVG_NS, "line");
    crosshair.setAttribute("y1", PAD.top);
    crosshair.setAttribute("y2", CHART_H - PAD.bottom);
    crosshair.setAttribute("stroke", "var(--text-muted)");
    crosshair.setAttribute("stroke-width", "1");
    crosshair.setAttribute("visibility", "hidden");
    svg.appendChild(crosshair);
    return crosshair;
  }

  // hover 감지용 투명 영역 (renderChart·renderCompareChart 공용)
  function createHitArea(svg) {
    const hitArea = document.createElementNS(SVG_NS, "rect");
    hitArea.setAttribute("x", PAD.left);
    hitArea.setAttribute("y", PAD.top);
    hitArea.setAttribute("width", plotW);
    hitArea.setAttribute("height", plotH);
    hitArea.setAttribute("fill", "transparent");
    svg.appendChild(hitArea);
    return hitArea;
  }

  // 최저점/최고점 표시 (모든 라인 차트 공용)
  // placedLabels: 여러 시리즈(예: 비교 차트의 real/calculated)가 같은 자리에 라벨을 겹쳐
  // 그리지 않도록 이미 놓인 라벨 위치를 공유하는 배열. 넘기지 않으면 이번 호출 안에서만 겹침을 피한다.
  // skipIdx: 이 인덱스(보통 마지막 값=현재값)와 x축상 가까우면 그 최고/최저 표시를 아예 생략한다.
  // 밀어내기로는 "최고값이 곧 현재값"인 경우를 못 풀어서(둘이 같은 자리라 밀 방향이 없음),
  // 자리가 겹칠 땐 표시 자체를 하나로 줄이는 쪽이 더 안전하다.
  function addMinMaxMarkers(svg, data, valueFn, color, placedLabels, skipIdx) {
    const n = data.length;
    if (n === 0) return;
    let minIdx = 0, maxIdx = 0;
    for (let i = 1; i < n; i++) {
      if (valueFn(data[i]) < valueFn(data[minIdx])) minIdx = i;
      if (valueFn(data[i]) > valueFn(data[maxIdx])) maxIdx = i;
    }
    const placed = placedLabels || [];
    const LABEL_W = 60, LABEL_H = 20;
    const skipPx = skipIdx == null ? null : xScale(skipIdx, n);
    [
      { idx: maxIdx, tag: "최고", markColor: "var(--diverge-red)" },
      { idx: minIdx, tag: "최저", markColor: "var(--diverge-blue)" },
    ].forEach(({ idx, tag, markColor }) => {
      const px = xScale(idx, n), py = yScale(valueFn(data[idx]));
      if (skipPx !== null && Math.abs(px - skipPx) < LABEL_W) return;
      const dot = document.createElementNS(SVG_NS, "circle");
      dot.setAttribute("cx", px);
      dot.setAttribute("cy", py);
      dot.setAttribute("r", "4");
      dot.setAttribute("fill", "var(--surface-1)");
      dot.setAttribute("stroke", markColor);
      dot.setAttribute("stroke-width", "2");
      svg.appendChild(dot);

      // 이미 놓인 라벨과 겹치면 같은 방향으로 한 줄씩 더 밀어낸다.
      const step = tag === "최고" ? -LABEL_H : LABEL_H;
      let ty = py + (tag === "최고" ? -10 : 16);
      let guard = 0;
      while (
        placed.some((p) => Math.abs(p.x - px) < LABEL_W && Math.abs(p.y - ty) < LABEL_H) &&
        guard++ < 8
      ) {
        ty += step;
      }
      placed.push({ x: px, y: ty });

      const label = document.createElementNS(SVG_NS, "text");
      label.setAttribute("x", px);
      label.setAttribute("y", ty);
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("font-size", "10");
      label.setAttribute("font-weight", "700");
      label.setAttribute("fill", markColor);
      label.textContent = `${tag} ${valueFn(data[idx]).toFixed(1)}`;
      svg.appendChild(label);
    });
  }

  function renderChart(data) {
    const svg = document.getElementById("chart");
    svg.innerHTML = "";
    const n = data.length;
    if (n === 0) return;

    const ns = SVG_NS;
    const baselineY = yScale(50);

    drawGridlines(svg, true);

    // 위(탐욕)/아래(공포) 영역 채우기 — 50을 기준으로 클램프한 값으로 면적을 그리면
    // 자연스럽게 50 교차 지점에서 영역이 끊깁니다.
    function buildAreaPath(clampFn) {
      let d = `M ${xScale(0, n)} ${baselineY} `;
      for (let i = 0; i < n; i++) {
        d += `L ${xScale(i, n)} ${yScale(clampFn(data[i].score))} `;
      }
      d += `L ${xScale(n - 1, n)} ${baselineY} Z`;
      return d;
    }

    const abovePath = document.createElementNS(ns, "path");
    abovePath.setAttribute("d", buildAreaPath((v) => Math.max(v, 50)));
    abovePath.setAttribute("fill", "var(--diverge-blue-wash)");
    svg.appendChild(abovePath);

    const belowPath = document.createElementNS(ns, "path");
    belowPath.setAttribute("d", buildAreaPath((v) => Math.min(v, 50)));
    belowPath.setAttribute("fill", "var(--diverge-red-wash)");
    svg.appendChild(belowPath);

    // 실제 값 선 (중립 잉크 색)
    let lineD = "";
    data.forEach((d, i) => {
      lineD += (i === 0 ? "M " : "L ") + xScale(i, n) + " " + yScale(d.score) + " ";
    });
    const linePath = document.createElementNS(ns, "path");
    linePath.setAttribute("d", lineD);
    linePath.setAttribute("fill", "none");
    linePath.setAttribute("stroke", "var(--text-secondary)");
    linePath.setAttribute("stroke-width", "2");
    linePath.setAttribute("stroke-linejoin", "round");
    linePath.setAttribute("stroke-linecap", "round");
    svg.appendChild(linePath);

    const lastX = xScale(n - 1, n), lastY = yScale(data[n - 1].score);
    // 최고/최저가 오늘 값과 같은 자리면 그 표시는 생략한다(skipIdx = 마지막 인덱스).
    addMinMaxMarkers(svg, data, (d) => d.score, null, null, n - 1);

    // 끝점 표시 + 직접 라벨 (오늘 값)
    const endDot = document.createElementNS(ns, "circle");
    endDot.setAttribute("cx", lastX);
    endDot.setAttribute("cy", lastY);
    endDot.setAttribute("r", "4");
    endDot.setAttribute("fill", data[n - 1].score >= 50 ? "var(--diverge-blue)" : "var(--diverge-red)");
    endDot.setAttribute("stroke", "var(--surface-1)");
    endDot.setAttribute("stroke-width", "2");
    svg.appendChild(endDot);

    const endLabel = document.createElementNS(ns, "text");
    endLabel.setAttribute("x", lastX - 6);
    endLabel.setAttribute("y", lastY - 10);
    endLabel.setAttribute("text-anchor", "end");
    endLabel.setAttribute("font-size", "12");
    endLabel.setAttribute("font-weight", "700");
    endLabel.setAttribute("fill", "var(--text-primary)");
    endLabel.textContent = data[n - 1].score.toFixed(1);
    svg.appendChild(endLabel);

    // ---- 크로스헤어 + 툴팁 (hover) ----
    const crosshair = createCrosshair(svg);

    const hoverDot = document.createElementNS(ns, "circle");
    hoverDot.setAttribute("r", "5");
    hoverDot.setAttribute("stroke", "var(--surface-1)");
    hoverDot.setAttribute("stroke-width", "2");
    hoverDot.setAttribute("visibility", "hidden");
    svg.appendChild(hoverDot);

    const hitArea = createHitArea(svg);

    const tooltip = document.getElementById("tooltip");

    function showTooltipAt(clientEvtX) {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientEvtX - rect.left) / rect.width) * CHART_W;
      let idx = Math.round(((relX - PAD.left) / plotW) * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));

      const px = xScale(idx, n), py = yScale(data[idx].score);
      crosshair.setAttribute("x1", px);
      crosshair.setAttribute("x2", px);
      crosshair.setAttribute("visibility", "visible");
      hoverDot.setAttribute("cx", px);
      hoverDot.setAttribute("cy", py);
      hoverDot.setAttribute("fill", data[idx].score >= 50 ? "var(--diverge-blue)" : "var(--diverge-red)");
      hoverDot.setAttribute("visibility", "visible");

      tooltip.style.opacity = "1";
      tooltip.innerHTML = "";
      const dateLine = document.createElement("div");
      dateLine.textContent = data[idx].date;
      const valueLine = document.createElement("div");
      valueLine.className = "tt-value";
      valueLine.textContent = data[idx].score.toFixed(1) + "점";
      tooltip.appendChild(dateLine);
      tooltip.appendChild(valueLine);

      const svgPixelRect = svg.getBoundingClientRect();
      const scaleX = svgPixelRect.width / CHART_W;
      const tooltipX = px * scaleX;
      tooltip.style.left = Math.min(tooltipX + 10, svgPixelRect.width - 110) + "px";
      tooltip.style.top = (py * (svgPixelRect.height / CHART_H) - 40) + "px";
    }

    function hideTooltip() {
      crosshair.setAttribute("visibility", "hidden");
      hoverDot.setAttribute("visibility", "hidden");
      tooltip.style.opacity = "0";
    }

    hitArea.addEventListener("pointermove", (e) => showTooltipAt(e.clientX));
    hitArea.addEventListener("pointerleave", hideTooltip);
  }

  function renderAll(rangeKey) {
    const data = filterRange(rangeKey);
    renderChart(data);
    renderTable(data);
  }

  // ---------- 실제값 vs 계산값 비교 차트 ----------

  function filterCompareRange(rangeKey) {
    if (rangeKey === "all") return comparison;
    if (comparison.length === 0) return comparison;
    const days = Number(rangeKey);
    const cutoff = daysAgo(comparison[comparison.length - 1].date, days);
    return comparison.filter((row) => row.date >= cutoff);
  }

  // 기간 전체 평균 차이 대신, 마우스로 가리킨 그 날짜의 차이를 보여준다
  // (2026-09-14 사용자 요청 — "선택기간 평균차이로 하지 말고 그 시기 F&G값과
  // 일별 계산값 차이를 넣어줘요").
  function renderDiffStat(data) {
    const statEl = document.getElementById("diff-stat");
    statEl.textContent = data.length === 0 ? "" : "차트를 가리키면 그 날짜의 차이를 보여줘요.";
  }

  function updateDiffStatForRow(row) {
    const statEl = document.getElementById("diff-stat");
    const diff = row.calculated - row.real;
    const direction = diff > 0.5 ? "높음" : diff < -0.5 ? "낮음" : "비슷함";
    statEl.innerHTML = "";
    const text = document.createElement("span");
    text.textContent = `${row.date} 차이: `;
    const strong = document.createElement("strong");
    strong.textContent = (diff >= 0 ? "+" : "") + diff.toFixed(1) + "점";
    const tail = document.createElement("span");
    tail.textContent = ` (일별 계산값이 F&G보다 ${direction})`;
    statEl.appendChild(text);
    statEl.appendChild(strong);
    statEl.appendChild(tail);
  }

  function renderCompareChart(data) {
    const svg = document.getElementById("compare-chart");
    svg.innerHTML = "";
    const n = data.length;
    if (n === 0) return;

    const ns = SVG_NS;

    drawGridlines(svg, false);

    function buildLine(key, color) {
      let d = "";
      data.forEach((row, i) => {
        d += (i === 0 ? "M " : "L ") + xScale(i, n) + " " + yScale(row[key]) + " ";
      });
      const path = document.createElementNS(ns, "path");
      path.setAttribute("d", d);
      path.setAttribute("fill", "none");
      path.setAttribute("stroke", color);
      path.setAttribute("stroke-width", "2");
      path.setAttribute("stroke-linejoin", "round");
      path.setAttribute("stroke-linecap", "round");
      svg.appendChild(path);
    }

    buildLine("real", "var(--cat-1)");
    buildLine("calculated", "var(--cat-2)");

    // 두 시리즈(F&G, 계산값)를 통틀어 전체 최고 하나, 전체 최저 하나만 표시한다.
    let hi = { v: -Infinity }, lo = { v: Infinity };
    data.forEach((row, i) => {
      if (row.real > hi.v) hi = { v: row.real, i };
      if (row.calculated > hi.v) hi = { v: row.calculated, i };
      if (row.real < lo.v) lo = { v: row.real, i };
      if (row.calculated < lo.v) lo = { v: row.calculated, i };
    });
    [
      { point: hi, tag: "최고", markColor: "var(--diverge-red)" },
      { point: lo, tag: "최저", markColor: "var(--diverge-blue)" },
    ].forEach(({ point, tag, markColor }) => {
      const px = xScale(point.i, n), py = yScale(point.v);
      const dot = document.createElementNS(ns, "circle");
      dot.setAttribute("cx", px);
      dot.setAttribute("cy", py);
      dot.setAttribute("r", "4");
      dot.setAttribute("fill", "var(--surface-1)");
      dot.setAttribute("stroke", markColor);
      dot.setAttribute("stroke-width", "2");
      svg.appendChild(dot);

      const label = document.createElementNS(ns, "text");
      label.setAttribute("x", px);
      label.setAttribute("y", tag === "최고" ? py - 10 : py + 16);
      label.setAttribute("text-anchor", "middle");
      label.setAttribute("font-size", "10");
      label.setAttribute("font-weight", "700");
      label.setAttribute("fill", markColor);
      label.textContent = `${tag} ${point.v.toFixed(1)}`;
      svg.appendChild(label);
    });

    // 크로스헤어 + 툴팁
    const crosshair = createCrosshair(svg);
    const hitArea = createHitArea(svg);

    const tooltip = document.getElementById("compare-tooltip");

    function showTooltipAt(clientEvtX) {
      const rect = svg.getBoundingClientRect();
      const relX = ((clientEvtX - rect.left) / rect.width) * CHART_W;
      let idx = Math.round(((relX - PAD.left) / plotW) * (n - 1));
      idx = Math.max(0, Math.min(n - 1, idx));

      const px = xScale(idx, n);
      crosshair.setAttribute("x1", px);
      crosshair.setAttribute("x2", px);
      crosshair.setAttribute("visibility", "visible");

      const row = data[idx];
      updateDiffStatForRow(row);
      tooltip.style.opacity = "1";
      tooltip.innerHTML = "";
      const dateLine = document.createElement("div");
      dateLine.textContent = row.date;
      const realLine = document.createElement("div");
      realLine.innerHTML = "";
      const realStrong = document.createElement("span");
      realStrong.className = "tt-value";
      realStrong.style.color = "var(--cat-1)";
      realStrong.textContent = row.real.toFixed(1);
      realLine.appendChild(document.createTextNode("실제 "));
      realLine.appendChild(realStrong);
      const calcLine = document.createElement("div");
      const calcStrong = document.createElement("span");
      calcStrong.className = "tt-value";
      calcStrong.style.color = "var(--cat-2)";
      calcStrong.textContent = row.calculated.toFixed(1);
      calcLine.appendChild(document.createTextNode("계산 "));
      calcLine.appendChild(calcStrong);
      const diffLine = document.createElement("div");
      const diffStrong = document.createElement("span");
      diffStrong.className = "tt-value";
      diffStrong.textContent = Math.abs(row.calculated - row.real).toFixed(1);
      diffLine.appendChild(document.createTextNode("차이 "));
      diffLine.appendChild(diffStrong);

      tooltip.appendChild(dateLine);
      tooltip.appendChild(realLine);
      tooltip.appendChild(calcLine);
      tooltip.appendChild(diffLine);

      const svgPixelRect = svg.getBoundingClientRect();
      const scaleX = svgPixelRect.width / CHART_W;
      const tooltipX = px * scaleX;
      tooltip.style.left = Math.min(tooltipX + 10, svgPixelRect.width - 110) + "px";
      tooltip.style.top = "10px";
    }

    function hideTooltip() {
      crosshair.setAttribute("visibility", "hidden");
      tooltip.style.opacity = "0";
      renderDiffStat(data);
    }

    hitArea.addEventListener("pointermove", (e) => showTooltipAt(e.clientX));
    hitArea.addEventListener("pointerleave", hideTooltip);
  }

  function renderCompareAll(rangeKey) {
    const data = filterCompareRange(rangeKey);
    renderCompareChart(data);
    renderDiffStat(data);
  }

  document.getElementById("filter-row").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll("#filter-row .filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentRange = btn.dataset.range;
    renderAll(currentRange);
  });

  document.getElementById("compare-filter-row").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll("#compare-filter-row .filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    currentCompareRange = btn.dataset.range;
    renderCompareAll(currentCompareRange);
  });

  document.getElementById("live-history-filter-row").addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-btn");
    if (!btn) return;
    document.querySelectorAll("#live-history-filter-row .filter-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    fetchLiveHistory(Number(btn.dataset.hours));
  });

  document.getElementById("table-toggle").addEventListener("click", () => {
    const wrap = document.getElementById("table-wrap");
    wrap.hidden = !wrap.hidden;
    document.getElementById("table-toggle").textContent = wrap.hidden ? "표로 보기" : "표 숨기기";
  });

  renderHero(today.date + " 기준 (정적 스냅샷, 갱신 중...)");
  renderAll("90");
  renderCompareAll("90");
  fetchLiveScore();
  fetchLiveHistory();
  fetchCnnRealScore();
  syncDailyDataFromSupabase(); // 정적 내보내기 이후 날짜를 Supabase의 매일 자동 기록으로 채움
  setInterval(fetchLiveScore, 60000); // 화면을 열어둔 동안 1분마다 최신값 재조회
  setInterval(fetchLiveHistory, 60000);
  setInterval(fetchCnnRealScore, 60000);
  setInterval(syncDailyDataFromSupabase, 300000); // 5분마다 새 날짜가 생겼는지 재확인
})();
</script>
</body>
</html>
